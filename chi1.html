<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>模擬觀看電視節目</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent; /* 移除手機點擊藍色陰影 */
    }
    body {
      font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      background-color: #1e1e24;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px 10px;
      overflow-x: hidden; 
    }

    h1 {
      margin-bottom: 15px;
      color: #00d2d3;
      text-shadow: 0 0 10px rgba(0,210,211,0.5);
      font-size: 1.6rem;
      text-align: center;
    }

    .container {
      display: flex;
      gap: 20px;
      width: 100%;
      max-width: 1200px;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .panel {
      background: #2b2d42;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    /* 1. 電視機區域 (手機版優先置頂顯示) */
    .tv-section {
      flex: 1 1 100%;
      width: 100%;
      min-width: 0; /* 防止子元素撐開容器 */
      max-width: 650px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative; 
      order: 1; /* 手機版排在最上方 */
    }

    .question-bar {
      background: #3d3f58;
      padding: 8px 16px;
      border-radius: 30px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #feca57;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      max-width: 100%;
    }

    .audio-btn {
      background: #00d2d3;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
      transition: transform 0.2s, background 0.2s;
    }

    .audio-btn:active {
      transform: scale(0.9);
    }

    .tv-frame {
      width: 100%;
      background: #111;
      border: 8px solid #485460;
      border-radius: 12px;
      padding-top: 56.25%; /* 16:9 比例 */
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
      z-index: 10;
    }

    @media (min-width: 600px) {
      .tv-frame {
        border-width: 16px;
        border-radius: 16px;
      }
    }

    .tv-off-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #050505;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #555;
      font-size: 1.2rem;
      z-index: 20;
    }

    .tv-content-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #141419;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 15px;
      text-align: center;
    }

    .tv-channel-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #00d2d3;
      margin-bottom: 15px;
      padding: 0 5px;
      word-break: break-word;
    }

    .watch-link-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #ff0000;
      color: #ffffff;
      text-decoration: none;
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
      transition: all 0.2s ease;
      touch-action: manipulation;
    }

    .watch-link-btn:active {
      transform: scale(0.95);
    }

    .tv-stand {
      width: 30%;
      max-width: 160px;
      height: 10px;
      background: #485460;
      border-radius: 0 0 8px 8px;
      margin-top: 1px;
    }

    .tv-base {
      width: 50%;
      max-width: 260px;
      height: 8px;
      background: #1e272e;
      border-radius: 5px;
    }

    .feedback-section {
      margin-top: 15px;
      display: flex;
      gap: 15px;
      z-index: 10;
      width: 100%;
      justify-content: center;
    }

    .emoji-btn {
      background: #2b2d42;
      border: 2px solid #54577c;
      color: white;
      padding: 10px 20px;
      font-size: 1.1rem;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
      flex: 1;
      max-width: 160px;
      touch-action: manipulation;
    }

    .emoji-btn:active {
      transform: translateY(2px);
      background: #54577c;
    }

    .feedback-result {
      margin-top: 10px;
      min-height: 24px;
      font-size: 1rem;
      color: #00ff66;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.3s ease;
      text-align: center;
    }

    .big-emoji-pop {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 6rem;
      pointer-events: none; 
      z-index: 100;
      opacity: 0;
      text-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    @keyframes popAndFade {
      0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
      }
      20% {
        transform: translate(-50%, -50%) scale(1.2);
        opacity: 1;
      }
      40% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
      80% {
        transform: translate(-50%, -60%) scale(0.8);
        opacity: 0.8;
      }
      100% {
        transform: translate(-50%, -80%) scale(1.3);
        opacity: 0;
      }
    }

    .animate-pop {
      animation: popAndFade 1.5s ease-out forwards;
    }

    /* 2. 左側：遙控器 */
    .remote-control {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      order: 2; /* 手機版排在中段 */
    }

    .remote-title {
      font-weight: bold;
      margin-bottom: 10px;
      color: #ff9f43;
    }

    .screen-display {
      background: #000;
      color: #00ff66;
      font-family: monospace;
      width: 100%;
      padding: 8px;
      text-align: center;
      border-radius: 4px;
      margin-bottom: 12px;
      border: 1px solid #333;
      font-size: 1.1rem;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
    }

    .btn {
      background: #3d3f58;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 0;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s;
      box-shadow: 0 4px 0 #1b1c2b;
      touch-action: manipulation;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 transparent; 
    }

    .color-1 { background: #ff4d4d !important; box-shadow: 0 4px 0 #cc0000; color: white !important; }
    .color-2 { background: #ff9933 !important; box-shadow: 0 4px 0 #cc6600; color: white !important; }
    .color-3 { background: #ffcc00 !important; box-shadow: 0 4px 0 #b38f00; color: #000 !important; }
    .color-4 { background: #33cc33 !important; box-shadow: 0 4px 0 #248f24; color: white !important; }
    .color-5 { background: #00cccc !important; box-shadow: 0 4px 0 #008f8f; color: white !important; }
    .color-6 { background: #3399ff !important; box-shadow: 0 4px 0 #005ce6; color: white !important; }
    .color-7 { background: #9966ff !important; box-shadow: 0 4px 0 #6600cc; color: white !important; }
    .color-8 { background: #ff66cc !important; box-shadow: 0 4px 0 #cc0099; color: white !important; }
    .color-9 { background: #a6a6a6 !important; box-shadow: 0 4px 0 #737373; color: white !important; }

    .btn-power {
      grid-column: span 3;
      background: #a0522d;
      box-shadow: 0 4px 0 #6e3519;
    }

    /* 3. 右側：節目表 */
    .program-guide {
      width: 100%;
      max-width: 650px;
      order: 3; /* 手機版排在最下方 */
    }

    .guide-title {
      font-weight: bold;
      margin-bottom: 12px;
      color: #00d2d3;
      border-bottom: 2px solid #3d3f58;
      padding-bottom: 8px;
    }

    .channel-list {
      list-style: none;
    }

    .channel-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      margin-bottom: 8px;
      background: #3d3f58;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
      touch-action: manipulation;
    }

    .channel-item:active {
      background: #54577c;
    }

    .channel-item.active {
      outline: 2px solid #fff;
    }

    .channel-num {
      padding: 4px 8px;
      border-radius: 4px;
      margin-right: 12px;
      font-size: 0.85rem;
      font-weight: bold;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .channel-name {
      font-size: 0.95rem;
      line-height: 1.3;
    }

    /* 平板與電腦大螢幕樣式排版 */
    @media (min-width: 850px) {
      body {
        padding: 20px;
      }
      h1 {
        font-size: 2rem;
        margin-bottom: 20px;
      }
      .remote-control {
        width: 220px;
        order: 1;
      }
      .tv-section {
        order: 2;
        width: auto;
      }
      .program-guide {
        width: 300px;
        order: 3;
      }
      .tv-channel-title {
        font-size: 1.3rem;
      }
      .watch-link-btn {
        font-size: 1.1rem;
        padding: 12px 24px;
      }
      .big-emoji-pop {
        font-size: 8rem;
      }
    }
  </style>
</head>
<body>

  <h1>模擬觀看電視節目</h1>

  <div class="container">
    <!-- 電視機 (手機版優先置頂，電腦版在中間) -->
    <div class="tv-section">
      <div class="question-bar">
        <span>你想睇咩電視節目？</span>
        <button class="audio-btn" onclick="speakQuestion()" title="播放聲音">🔊</button>
      </div>

      <div class="tv-frame">
        <div class="tv-off-screen" id="tvOffScreen">電視已關閉</div>
        <!-- 開機後顯示連結按鈕區域 -->
        <div class="tv-content-screen" id="tvContentScreen">
          <div class="tv-channel-title" id="tvChannelTitle">請選擇頻道</div>
          <a id="watchLinkBtn" class="watch-link-btn" href="#" target="_blank" rel="noopener noreferrer">
            <span>▶ 觀看電視節目</span>
          </a>
        </div>
      </div>
      <div class="tv-stand"></div>
      <div class="tv-base"></div>

      <div class="feedback-section">
        <button class="emoji-btn" onclick="giveFeedback('喜歡', '👍')">👍 喜歡</button>
        <button class="emoji-btn" onclick="giveFeedback('不喜歡', '👎')">👎 不喜歡</button>
      </div>
      <div id="feedbackResult" class="feedback-result"></div>
      <div id="bigEmojiPop" class="big-emoji-pop"></div>
    </div>

    <!-- 遙控器 -->
    <div class="panel remote-control">
      <div class="remote-title">遙控器</div>
      <div class="screen-display" id="remoteDisplay">OFF</div>
      
      <div class="keypad">
        <button class="btn btn-power" onclick="togglePower()">開關</button>
        <button class="btn color-1" onclick="pressNumber(1)">1</button>
        <button class="btn color-2" onclick="pressNumber(2)">2</button>
        <button class="btn color-3" onclick="pressNumber(3)">3</button>
        <button class="btn color-4" onclick="pressNumber(4)">4</button>
        <button class="btn color-5" onclick="pressNumber(5)">5</button>
        <button class="btn color-6" onclick="pressNumber(6)">6</button>
        <button class="btn color-7" onclick="pressNumber(7)">7</button>
        <button class="btn color-8" onclick="pressNumber(8)">8</button>
        <button class="btn color-9" onclick="pressNumber(9)">9</button>
      </div>
    </div>

    <!-- 節目表 -->
    <div class="panel program-guide">
      <div class="guide-title">節目表</div>
      <ul class="channel-list" id="channelList">
      </ul>
    </div>
  </div>

  <script>
    const channels = {
      1: { name: "劇集《愛回家之開心速遞》", videoId: "GRjVjt1ASxo" },
      2: { name: "烹飪節目《流行都市》", videoId: "rjpgoI5-pCM" },
      3: { name: "兒童節目《Hands up》", videoId: "XiWbT45PS0g" },
      4: { name: "動畫《多啦A夢》", videoId: "yR2vEO_icbs" },
      5: { name: "運動節目《運動大本營》", videoId: "QV9n4Rx1Y_k" },
      6: { name: "音樂節目《流行經典50年》", videoId: "IB41tS0R-ok" },
      7: { name: "旅遊節目《江湖見2》", videoId: "NCiRWxwIYZQ" },
      8: { name: "新聞節目《神舟二十三號》", videoId: "pwAMbWDY8LA" },
      9: { name: "動物節目《大熊貓來了》", videoId: "r4RsWcg5Mu4" }
    };

    let isPowerOn = false;
    let currentChannel = 1;
    let feedbackTimeout; 

    const tvOffScreen = document.getElementById('tvOffScreen');
    const tvChannelTitle = document.getElementById('tvChannelTitle');
    const watchLinkBtn = document.getElementById('watchLinkBtn');
    const remoteDisplay = document.getElementById('remoteDisplay');
    const channelList = document.getElementById('channelList');
    const feedbackResult = document.getElementById('feedbackResult');
    const bigEmojiPop = document.getElementById('bigEmojiPop');

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); 
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-HK'; 
        utterance.rate = 0.9; 
        window.speechSynthesis.speak(utterance);
      } else {
        alert("抱歉，你的瀏覽器不支援語音發聲功能。");
      }
    }

    function speakQuestion() {
      speakText("你想睇咩電視節目？");
    }

    function giveFeedback(answer, emojiStr) {
      feedbackResult.textContent = `謝謝回答，你答了「${answer}」`;
      feedbackResult.style.opacity = 1;

      speakText(`謝謝回答，你答了${answer}`);

      bigEmojiPop.classList.remove('animate-pop');
      void bigEmojiPop.offsetWidth; 
      bigEmojiPop.textContent = emojiStr;
      bigEmojiPop.classList.add('animate-pop');

      clearTimeout(feedbackTimeout);
      feedbackTimeout = setTimeout(() => {
        feedbackResult.style.opacity = 0;
      }, 3000);
    }

    function initProgramGuide() {
      channelList.innerHTML = '';
      for (let num in channels) {
        const li = document.createElement('li');
        li.className = `channel-item ${num == currentChannel ? 'active' : ''}`;
        li.id = `ch-item-${num}`;
        li.onclick = () => {
          if (!isPowerOn) togglePower();
          switchChannel(parseInt(num));
        };

        li.innerHTML = `
          <span class="channel-num color-${num}">CH ${num.padStart(2, '0')}</span>
          <span class="channel-name">${channels[num].name}</span>
        `;
        channelList.appendChild(li);
      }
    }

    function togglePower() {
      isPowerOn = !isPowerOn;
      if (isPowerOn) {
        tvOffScreen.style.display = 'none';
        switchChannel(currentChannel);
      } else {
        tvOffScreen.style.display = 'flex';
        remoteDisplay.textContent = "OFF";
      }
    }

    function pressNumber(num) {
      if (!isPowerOn) {
        isPowerOn = true;
        tvOffScreen.style.display = 'none';
      }
      switchChannel(num);
    }

    function switchChannel(num) {
      if (!channels[num]) return;

      currentChannel = num;
      const chData = channels[num];

      remoteDisplay.textContent = `CH: ${num.toString().padStart(2, '0')}`;
      
      // 更新電視畫面內的頻道名稱與 YouTube 外部連結
      tvChannelTitle.textContent = `CH ${num.toString().padStart(2, '0')}: ${chData.name}`;
      watchLinkBtn.href = `https://www.youtube.com/watch?v=${chData.videoId}`;

      document.querySelectorAll('.channel-item').forEach(item => {
        item.classList.remove('active');
      });
      const activeItem = document.getElementById(`ch-item-${num}`);
      if (activeItem) {
        activeItem.classList.add('active');
      }
    }

    initProgramGuide();
  </script>
</body>
</html>
